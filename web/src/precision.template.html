<title>Treino de Precisão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --ink: #2a2340;
    --muted: #6b6485;
    --paper: rgba(255, 250, 242, 0.88);
    --paper-solid: #fffaf2;
    --line: rgba(42, 35, 64, 0.12);
    --accent: #d9482b;
    --good: #2f8a4a;
    --plum: #5a4796;
    --sky: #cfe6ee;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--sky); color: var(--ink); font-family: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: grid; grid-template-columns: minmax(0, 310px) 1fr minmax(0, 330px); grid-template-rows: 1fr auto; gap: 12px;
  }
  .panel {
    pointer-events: auto; background: var(--paper);
    -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(42, 35, 64, 0.12); padding: 14px 16px;
  }
  .left { grid-column: 1; grid-row: 1; align-self: start; display: flex; flex-direction: column; gap: 10px; }
  .right { grid-column: 3; grid-row: 1; align-self: start; display: flex; flex-direction: column; gap: 10px; max-height: 100%; min-height: 0; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { margin: 2px 0 2px; font-size: 24px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  h2 { margin: 0 0 8px; font-size: 14px; font-weight: 800; }
  .sub { font-size: 12.5px; color: var(--muted); }
  .attempt { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .attempt .lbl { font-size: 12px; color: var(--muted); }
  .attempt b { font: 700 34px/1 "JetBrains Mono", monospace; letter-spacing: -.02em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .stat b { display: block; font: 700 20px/1.1 "JetBrains Mono", monospace; }
  .stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #e9b84a, #2f8a4a); border-radius: inherit; transition: width .3s; }
  .stage { font-size: 12px; margin-top: 8px; color: var(--muted); }
  .stage b { color: var(--ink); }
  #chart { width: 100%; height: 150px; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 4px; }
  .diary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.35; max-height: 230px; overflow: auto; }
  .diary li { display: grid; grid-template-columns: 74px 1fr; gap: 6px; }
  .diary .t { font: 500 11px "JetBrains Mono", monospace; color: var(--muted); padding-top: 1px; }
  .diary li.mark { cursor: pointer; }
  .diary li.mark:hover span:last-child { text-decoration: underline; }
  .diary li.new { animation: flash 1.2s; }
  @keyframes flash { 0% { background: rgba(233, 184, 74, .35); } 100% { background: transparent; } }
  .controls { grid-column: 1 / 4; grid-row: 2; justify-self: center; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; padding: 10px 12px; max-width: min(1100px, calc(100vw - 32px)); }
  .seg { display: flex; background: rgba(42, 35, 64, 0.07); border-radius: 10px; padding: 3px; gap: 2px; align-items: center; }
  .seg .cap { font-size: 11px; color: var(--muted); padding: 0 6px 0 4px; white-space: nowrap; }
  button { font: 600 13px/1 "Bricolage Grotesque", system-ui, sans-serif; color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 8px 11px; cursor: pointer; }
  button:hover { background: rgba(42, 35, 64, 0.08); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper-solid); }
  .toggle[aria-pressed="true"] { background: rgba(217, 72, 43, .14); color: var(--accent); }
  .clock { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 170px; }
  .clock input { flex: 1; accent-color: var(--ink); }
  .clock .mono { min-width: 46px; }
  .banner {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.92);
    background: var(--paper-solid); border-radius: 20px; padding: 16px 24px; text-align: center; max-width: calc(100% - 32px);
    box-shadow: 0 18px 50px rgba(42, 35, 64, .25); opacity: 0; transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); pointer-events: none;
  }
  .banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .banner .big { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  .banner .s { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .cmp-labels { position: fixed; top: 27%; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; }
  .cmp-labels span { background: var(--ink); color: var(--paper-solid); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 99px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); pointer-events: none; }
  @media (max-width: 900px) {
    #ui { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto; gap: 8px; }
    .left { grid-row: 1; }
    .left .sub, .stage { display: none; }
    .panel { padding: 10px 12px; border-radius: 14px; }
    .left .eyebrow { display: none; }
    h1 { font-size: 18px; }
    .attempt { margin-top: 4px; } .stats { margin-top: 4px; } .stat b { font-size: 16px; } .meter { margin-top: 6px; }
    .right { grid-column: 1; grid-row: 3; gap: 8px; }
    .right h2 { display: none; }
    .legend { display: none; }
    .diary { max-height: none; } .diary li:not(:first-child) { display: none; }
    .controls { grid-column: 1; grid-row: 4; gap: 6px; padding: 8px; }
    .controls button { padding: 7px 9px; }
    .clock { min-width: 0; flex: 1 1 100%; }
    #chart { height: 64px; }
    .attempt b { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { .banner { transition: none; } .diary li.new { animation: none; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAPE = /*TAPE*/;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const P = DRILL.PRECISION;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtN = n => n.toLocaleString('pt-BR');
const fmtMin = m => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;

/* =========================================================
   Cérebro: lê a foto (pesos de 16 bits) e decide as ações
   ========================================================= */
function makeBrain(ck) {
  const bin = atob(ck.w), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const all = new Int16Array(bytes.buffer);
  let off = 0;
  const layers = TAPE.dims.layers.map(([nin, nout], k) => {
    const s = ck.scales[k];
    const w = Float32Array.from(all.subarray(off, off + nin * nout), v => v * s); off += nin * nout;
    const b = Float32Array.from(all.subarray(off, off + nout), v => v * s); off += nout;
    return { nin, nout, w, b, y: new Float32Array(nout) };
  });
  return (obs, rng, out) => {
    let x = obs;
    layers.forEach((l, k) => {
      for (let j = 0; j < l.nout; j++) { let s = l.b[j]; const r = j * l.nin; for (let i = 0; i < l.nin; i++) s += l.w[r + i] * x[i]; l.y[j] = k < layers.length - 1 ? Math.tanh(s) : s; }
      x = l.y;
    });
    let o = 0;
    TAPE.dims.actions.forEach((n, h) => {
      let m = -Infinity; for (let i = 0; i < n; i++) m = Math.max(m, x[o + i]);
      let z = 0; for (let i = 0; i < n; i++) z += Math.exp(x[o + i] - m);
      let u = rng.next() * z, pick = n - 1;
      for (let i = 0; i < n; i++) { u -= Math.exp(x[o + i] - m); if (u <= 0) { pick = i; break; } }
      out[h] = pick; o += n;
    });
  };
}
const brains = new Map();
const brainAt = i => { if (!brains.has(i)) brains.set(i, makeBrain(TAPE.checkpoints[i])); return brains.get(i); };

/* =========================================================
   Cena
   ========================================================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const HORIZON = 0xf4ddc2;
scene.fog = new THREE.Fog(HORIZON, 60, 170);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = 1.35; controls.minDistance = 8; controls.maxDistance = 90; controls.enablePan = false;
scene.add(new THREE.Mesh(new THREE.SphereGeometry(320, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x86c3dc) }, mid: { value: new THREE.Color(HORIZON) }, bot: { value: new THREE.Color(0xe7a996) } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(mid, top, smoothstep(0.0, 0.55, h)) : mix(mid, bot, smoothstep(0.0, -0.6, h));
    gl_FragColor = vec4(c, 1.0);
    #include <colorspace_fragment>
    }`,
})));
scene.add(new THREE.HemisphereLight(0xe3f2ff, 0xc9a77c, 1.15));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.5);
sun.position.set(14, 34, 18); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -36, right: 36, top: 20, bottom: -20, near: 5, far: 100 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

let seedV = 99;
const srand = () => { seedV = (seedV * 16807) % 2147483647; return (seedV - 1) / 2147483646; };
const noise3 = (x, y, z) => Math.sin(x * .7 + y * 1.3) * Math.cos(z * .9 - y * .5) + .5 * Math.sin(x * 1.9 - z * 1.7 + y * .8);
function makeRockBase(radius, height, seg, rings, cTop, cBot) {
  const geo = new THREE.ConeGeometry(radius, height, seg, rings); geo.rotateX(Math.PI);
  const pos = geo.attributes.position, colors = [], top = new THREE.Color(cTop), bot = new THREE.Color(cBot), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (y < height / 2 - .01) { const n = noise3(x * .35, y * .35, z * .35), k = 1 + n * .12; x *= k; z *= k; y += n * height * .03; pos.setXYZ(i, x, y, z); }
    tmp.copy(bot).lerp(top, Math.pow(THREE.MathUtils.clamp((y + height / 2) / height, 0, 1), .8)); colors.push(tmp.r, tmp.g, tmp.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3)); geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
}
function canvasTex(draw, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const dotTex = canvasTex(x => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(.55, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); }, 64, 64);
const targetTex = canvasTex((x, w) => {
  const c = w / 2, rings = ['#d9482b', '#fff8ec', '#d9482b', '#fff8ec', '#f2c14e'];
  rings.forEach((col, i) => { x.fillStyle = col; x.beginPath(); x.arc(c, c, c * (1 - i * .19), 0, TAU); x.fill(); });
}, 256, 256);

// arenas (uma normal; outra aparece no modo de comparação)
const ARENA_GAP = 30;
function buildIsland(cx) {
  const g = new THREE.Group(); g.position.x = cx; scene.add(g);
  const R = P.arenaR + 3.5;
  const top = new THREE.Mesh(new THREE.CylinderGeometry(R, R - .5, 1.2, 64), new THREE.MeshStandardMaterial({ color: 0x9fcf7f, roughness: 1 }));
  top.position.y = -.6; top.receiveShadow = true; g.add(top);
  const base = makeRockBase(R - .5, 12, 26, 5, 0xc39266, 0x7c6a93); base.position.y = -1.2 - 6; g.add(base);
  const chalk = new THREE.Mesh(new THREE.RingGeometry(P.arenaR - .08, P.arenaR + .08, 96), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .85 }));
  chalk.rotation.x = -Math.PI / 2; chalk.position.y = .02; g.add(chalk);
  const spot = new THREE.Mesh(new THREE.CircleGeometry(.35, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .7 }));
  spot.rotation.x = -Math.PI / 2; spot.position.y = .02; g.add(spot);
  // grama e cones decorativos
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  const n = 260, geo = new THREE.ConeGeometry(.08, .35, 4); geo.translate(0, .22, 0);
  const inst = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }), n);
  for (let i = 0; i < n; i++) {
    const a = srand() * TAU, d = Math.sqrt(srand()) * R;
    p.set(Math.cos(a) * d, 0, Math.sin(a) * d); q.setFromEuler(new THREE.Euler((srand() - .5) * .4, srand() * TAU, (srand() - .5) * .4));
    const k = .6 + srand() * .9; s.set(k, k, k); inst.setMatrixAt(i, m.compose(p, q, s));
    inst.setColorAt(i, col.setHSL(.26 + srand() * .06, .45, .42 + srand() * .14));
  }
  g.add(inst);
  const coneGeo = new THREE.ConeGeometry(.22, .55, 12), coneMat = new THREE.MeshStandardMaterial({ color: 0xf08a3c, roughness: .6 });
  for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; const c = new THREE.Mesh(coneGeo, coneMat); c.position.set(Math.cos(a) * (P.arenaR + .7), .27, Math.sin(a) * (P.arenaR + .7)); c.castShadow = true; g.add(c); }
  const trunkGeo = new THREE.CylinderGeometry(.22, .34, 1.7, 7), trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a5e3c, roughness: 1, flatShading: true });
  const leafGeo = new THREE.IcosahedronGeometry(1.5, 0), leafMat = new THREE.MeshStandardMaterial({ color: 0x6aa84f, roughness: .9, flatShading: true });
  for (const a of [.5, 1.6, 2.9, 4.1, 5.3]) {
    const t = new THREE.Group(); t.position.set(Math.cos(a) * (R - 1.4), 0, Math.sin(a) * (R - 1.4)); t.scale.setScalar(.8 + srand() * .3);
    const tr = new THREE.Mesh(trunkGeo, trunkMat); tr.position.y = .85; tr.castShadow = true; t.add(tr);
    const l = new THREE.Mesh(leafGeo, leafMat); l.position.y = 2.6; l.castShadow = true; t.add(l); g.add(t);
  }
  return g;
}
const islands = [buildIsland(0), buildIsland(ARENA_GAP)];
islands[1].visible = false;

/* =========================================================
   Atleta (Cabeçudo)
   ========================================================= */
/*CABECUDO*/

const LOOKS = [
  { nick: 'TROVÃO', num: 10, skin: '#e8b896', hair: 'curto', hairColor: '#1d1a1f', glasses: 'nenhum', beard: 'nenhuma', expr: 'confiante', forca: .35, vel: .7, team: { p: '#1f7a4d', s: '#f4f1e8' } },
  { nick: 'PASTEL', num: 1, skin: '#6e4527', hair: 'afro', hairColor: '#1d1a1f', glasses: 'redondo', beard: 'nenhuma', expr: 'neutro', forca: .8, vel: .2, team: { p: '#1f7a4d', s: '#f4f1e8' } },
  { nick: 'XERIFE', num: 9, skin: '#c98e66', hair: 'bone', hairColor: '#4a2f1e', glasses: 'nenhum', beard: 'bigode', expr: 'bravo', forca: .5, vel: .5, team: { p: '#c62f2f', s: '#1f1d24' } },
  { nick: 'RAPOSA', num: 4, skin: '#f6d7c3', hair: 'coque', hairColor: '#b5462f', glasses: 'escuro', beard: 'nenhuma', expr: 'confiante', forca: .2, vel: .8, team: { p: '#2459c9', s: '#36d0de' } },
];
let lookIdx = 0;
function tagTex(look) {
  return canvasTex((x, w, h) => {
    const label = `${look.nick} ${look.num}`;
    x.font = '800 30px "Bricolage Grotesque", system-ui, sans-serif';
    const tw = Math.min(248, x.measureText(label).width + 28);
    x.fillStyle = look.team.p; x.beginPath(); x.roundRect((w - tw) / 2, 10, tw, 42, 21); x.fill();
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(label, w / 2, 32);
  }, 256, 64);
}

/* bola e alvos */
const ballGeo = (() => {
  const geo = new THREE.IcosahedronGeometry(P.ballR, 1), n = geo.attributes.position.count, cols = new Float32Array(n * 3);
  for (let f = 0; f < n / 3; f++) { const dark = [0, 5, 10, 15, 22, 27, 33, 38, 44, 51, 57, 63, 68, 74].includes(f); for (let v = 0; v < 3; v++) { const c = dark ? .12 : .97; cols.set([c, c, dark ? .18 : .95], (f * 3 + v) * 3); } }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3)); geo.computeVertexNormals(); return geo;
})();
const ballMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .45, flatShading: true });
const boardGeo = new THREE.CylinderGeometry(P.targetR, P.targetR, .12, 32);
const boardMats = [new THREE.MeshStandardMaterial({ color: 0xd9482b, roughness: .6 }), new THREE.MeshStandardMaterial({ map: targetTex, roughness: .6 }), new THREE.MeshStandardMaterial({ map: targetTex, roughness: .6 })];
const poleGeo = new THREE.CylinderGeometry(.05, .07, .5, 8), poleMat = new THREE.MeshStandardMaterial({ color: 0x8a5e3c, roughness: .9 });
function makeTarget(parent) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(poleGeo, poleMat); pole.position.y = .1; g.add(pole);
  const board = new THREE.Mesh(boardGeo, boardMats); board.rotation.x = Math.PI / 2; board.position.y = P.targetR + .02; board.castShadow = true;
  const holder = new THREE.Group(); holder.add(board); g.add(holder);
  parent.add(g);
  return { g, holder, grow: 1, pop: 0, popVel: new THREE.Vector3() };
}

/* partículas */
const PMAX = 500, pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3), parts = [];
for (let i = 0; i < PMAX; i++) { parts.push({ life: 0, vx: 0, vy: 0, vz: 0, g: 9 }); pPos[i * 3 + 1] = -999; }
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: .28, map: dotTex, vertexColors: true, transparent: true, depthWrite: false }));
points.frustumCulled = false; scene.add(points);
let pNext = 0; const tc = new THREE.Color();
function burst(x, y, z, color, n, spd, up = 3, grav = 9, life = .9) {
  tc.set(color);
  for (let i = 0; i < n; i++) {
    const k = pNext = (pNext + 1) % PMAX, p = parts[k], a = Math.random() * TAU, s = spd * (.3 + Math.random());
    p.life = life * (.6 + Math.random() * .6); p.vx = Math.cos(a) * s; p.vz = Math.sin(a) * s; p.vy = up * (.5 + Math.random()); p.g = grav;
    pPos[k * 3] = x; pPos[k * 3 + 1] = y; pPos[k * 3 + 2] = z; pCol[k * 3] = tc.r; pCol[k * 3 + 1] = tc.g; pCol[k * 3 + 2] = tc.b;
  }
}
function updateParticles(dt) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i]; if (p.life <= 0) continue;
    p.life -= dt; p.vy -= p.g * dt;
    pPos[i * 3] += p.vx * dt; pPos[i * 3 + 1] += p.vy * dt; pPos[i * 3 + 2] += p.vz * dt;
    if (pPos[i * 3 + 1] < .03) { pPos[i * 3 + 1] = .03; p.vy *= -.25; p.vx *= .6; p.vz *= .6; }
    if (p.life <= 0) pPos[i * 3 + 1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

/* =========================================================
   Uma arena = ambiente + cérebro + visual
   ========================================================= */
class Arena {
  constructor(island, main) {
    this.island = island; this.main = main;
    this.ball = new THREE.Mesh(ballGeo, ballMat); this.ball.castShadow = true; this.ball.visible = false; island.add(this.ball);
    this.tg = [0, 1, 2].map(() => makeTarget(island));
    this.obs = new Float32Array(DRILL.PRECISION_OBS); this.act = [1, 1, 0];
    this.acc = 0; this.spring = { a: 0, v: 0, b: 0, w: 0 }; this.prevY = 0; this.prevVy = 0;
    this.celebrate = 0; this.blink = 2;
    this.buildAthlete();
  }
  buildAthlete() {
    if (this.rig) { this.island.remove(this.rig.root); this.island.remove(this.tag); }
    const look = LOOKS[lookIdx];
    const p = { ...look, gear: { tenis: true, munhequeira: false, faixa: false, medalha: false, lesionado: false } };
    this.rig = buildCabecudo(p); this.rig.root.scale.setScalar(.95); this.island.add(this.rig.root);
    setExpr(this.rig.face, look.expr); this.look = look;
    this.tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagTex(look), transparent: true, depthTest: false }));
    this.tag.scale.set(2.2, .55, 1); this.tag.renderOrder = 10; this.island.add(this.tag);
  }
  start(ckIdx, seed) {
    this.ck = ckIdx; this.brain = brainAt(ckIdx);
    this.env = new DRILL.PrecisionDrill(seed, true);
    this.rng = new DRILL.Rng(seed ^ 0x9e3779b9);
    this.evIdx = 0; this.acc = 0;
    this.env.targets.forEach((t, i) => { this.tg[i].grow = 0; this.tg[i].pop = 0; });
  }
  update(dt, speed, time) {
    const e = this.env;
    if (!e.done) {
      this.acc += dt * speed;
      while (this.acc >= P.dt && !e.done) { e.observe(this.obs); this.brain(this.obs, this.rng, this.act); e.step(this.act[0], this.act[1], this.act[2]); this.acc -= P.dt; }
    }
    // eventos
    while (this.evIdx < e.events.length) {
      const ev = e.events[this.evIdx++];
      if (ev.type === 'hit') {
        const t = this.tg[ev.target];
        t.pop = 1; t.popFrom = t.g.position.clone();
        burst(ev.x + this.island.position.x, .8, ev.z, 0xd9482b, 16, 3.2, 4); burst(ev.x + this.island.position.x, .8, ev.z, 0xfff3d6, 10, 2.6, 4);
        this.celebrate = .7;
        if (this.main) onHit();
      } else if (ev.type === 'spawn') {
        const t = this.tg[ev.target]; t.next = { x: ev.x, z: ev.z };
      } else if (ev.type === 'miss') {
        burst(ev.x + this.island.position.x, .2, ev.z, 0xcdbca3, 6, .8, 1.2, 6, .6);
      } else if (ev.type === 'kick') { this.kickT = .3; }
    }
    // alvos
    e.targets.forEach((tgt, i) => {
      const t = this.tg[i];
      if (t.pop > 0) {
        t.pop -= dt * 2.2;
        const k = Math.max(0, t.pop);
        t.holder.scale.setScalar(k); t.holder.position.y = (1 - k) * 1.6; t.holder.rotation.y += dt * 14;
        if (t.pop <= 0) { t.g.position.set(tgt.x, 0, tgt.z); t.grow = 0; t.holder.position.y = 0; }
      } else {
        t.g.position.set(tgt.x, 0, tgt.z);
        t.grow = Math.min(1, t.grow + dt * 2.5);
        const g = t.grow, eb = 1 + 2.7 * Math.pow(g - 1, 3) + 1.7 * Math.pow(g - 1, 2);
        t.holder.scale.setScalar(Math.max(.001, eb));
      }
      t.g.rotation.y = Math.atan2(camera.position.x - this.island.position.x - t.g.position.x, camera.position.z - t.g.position.z);
    });
    // bola
    const B = e.ball;
    this.ball.visible = B.live;
    if (B.live) {
      this.ball.position.set(B.x, P.ballR, B.z);
      const sp = Math.hypot(B.vx, B.vz);
      if (sp > .01) { const ax = new THREE.Vector3(B.vz, 0, -B.vx).normalize(); this.ball.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(ax, sp * dt * speed / P.ballR)); }
    }
    this.animateAthlete(dt, time);
  }
  animateAthlete(dt, time) {
    const pl = this.env.player, rig = this.rig, b = rig.body, L = rig.legs, A = rig.arms;
    rig.root.position.set(pl.x, 0, pl.z); rig.root.rotation.y = Math.PI / 2 - pl.h;
    this.tag.position.set(pl.x, 2.9, pl.z);
    b.position.set(0, 0, 0); b.rotation.set(0, 0, 0);
    for (const l of L) l.rotation.set(0, 0, 0);
    for (const a of A) a.rotation.set(0, 0, 0);
    const sp = Math.min(1, Math.abs(pl.v) / P.speed), dir = pl.v >= 0 ? 1 : -1, ph = pl.phase * 1.3;
    let drive = 0, sway = 0;
    if (this.celebrate > 0) {
      this.celebrate -= dt;
      const up = Math.sin((.7 - this.celebrate) / .7 * Math.PI);
      b.position.y = up * .35; A[0].rotation.z = -2.5 * up; A[1].rotation.z = 2.5 * up; drive = up;
      setExpr(rig.face, 'feliz');
    } else {
      const amp = .2 + .8 * sp;
      L[0].rotation.x = Math.sin(ph) * amp * dir; L[1].rotation.x = Math.sin(ph + Math.PI) * amp * dir;
      A[0].rotation.x = Math.sin(ph + Math.PI) * amp * .9; A[1].rotation.x = Math.sin(ph) * amp * .9;
      A[0].rotation.z = -.12; A[1].rotation.z = .12;
      b.position.y = Math.abs(Math.sin(ph)) * .07 * sp; b.rotation.x = .15 * sp * dir; sway = Math.cos(ph) * .6 * sp;
      setExpr(rig.face, this.kickT > 0 ? 'bravo' : this.look.expr);
    }
    if (this.kickT > 0) {
      this.kickT -= dt; const k = 1 - this.kickT / .3, swing = k < .35 ? (k / .35) * .9 : .9 - (k - .35) / .65 * 2.4;
      L[1].rotation.x = swing; A[0].rotation.x = -swing * .6; drive += 1;
    }
    this.blink -= dt; let ey = 1; if (this.blink < 0) { ey = .1; if (this.blink < -.12) this.blink = 2 + Math.random() * 3; }
    for (const e of rig.face.eyes) e.scale.y = ey;
    const vy = (b.position.y - this.prevY) / Math.max(dt, 1e-3), ay = (vy - this.prevVy) / Math.max(dt, 1e-3);
    this.prevY = b.position.y; this.prevVy = vy;
    const s = this.spring;
    s.v += (-70 * s.a - 5 * s.v + THREE.MathUtils.clamp(ay, -60, 60) * .012 + drive * .2) * dt;
    s.w += (-70 * s.b - 5 * s.w + sway * 2.2) * dt;
    s.a = THREE.MathUtils.clamp(s.a + s.v * dt, -.5, .5); s.b = THREE.MathUtils.clamp(s.b + s.w * dt, -.4, .4);
    rig.headPivot.rotation.x = s.a; rig.headPivot.rotation.z = s.b;
  }
}

const main = new Arena(islands[0], true);
const ghost = new Arena(islands[1], false);

/* =========================================================
   Sessões: a fita é dividida em 3 sessões de 2 horas
   ========================================================= */
const CK = TAPE.checkpoints, N = CK.length, SESSIONS = 3;
const sessionRange = s => [Math.floor(s * (N - 1) / SESSIONS), Math.floor((s + 1) * (N - 1) / SESSIONS)];
let session = 0, minutes = 60, mode = 'live', speed = 2, compare = false;
let montageIdx = 0, attemptSeed = 1, liveExtra = 0, sessionRecord = 0, shownMarks = new Set();
const availIdx = () => { const [a, b] = sessionRange(session); return a + Math.round((b - a) * Math.min(1, minutes / 120)); };

function attemptNumber(ck) { return CK[ck].episodes + 1 + (mode === 'live' ? liveExtra : 0); }
function startAttempt() {
  const ck = mode === 'live' ? availIdx() : montageIdx;
  attemptSeed = (attemptSeed * 48271) % 2147483647;
  main.start(ck, attemptSeed);
  if (compare) ghost.start(0, attemptSeed);
  updatePanel(true);
}
function onHit() {}
function attemptEnded() {
  const h = main.env.hits;
  if (mode === 'live' && h > sessionRecord) {
    if (sessionRecord > 0) addDiary(`Tentativa ${fmtN(attemptNumber(main.ck))}`, `Novo recorde da sessão: ${h} acertos numa tentativa.`, true);
    sessionRecord = h;
  }
}
/* diário: marcos do treino conforme a fita é liberada */
function addDiary(t, text, fresh, ck) {
  const li = document.createElement('li'); if (fresh) li.className = 'new';
  if (ck !== undefined) { li.classList.add('mark'); li.title = 'Assistir este momento'; li.addEventListener('click', () => jumpTo(ck)); }
  li.innerHTML = `<span class="t">${t}</span><span></span>`; li.lastChild.textContent = text;
  $('diary').prepend(li);
  while ($('diary').children.length > 30) $('diary').lastChild.remove();
}
function syncMarks(fresh) {
  const upTo = availIdx();
  for (const m of TAPE.milestones) {
    if (m.ck <= upTo && !shownMarks.has(m.ck)) { shownMarks.add(m.ck); addDiary(`Tentativa ${fmtN(CK[m.ck].episodes + 1)}`, m.text, fresh, m.ck); }
  }
}
function resetDiary() {
  $('diary').innerHTML = ''; shownMarks = new Set(); sessionRecord = 0;
  addDiary(fmtMin(0), `Início da sessão ${session + 1}: o atleta parte de ${CK[sessionRange(session)[0]].hits.toFixed(1)} acertos por tentativa.`, false);
  syncMarks(false);
}
function jumpTo(ck) {
  // encontra a sessão e o horário em que esse momento é liberado
  for (let s = 0; s < SESSIONS; s++) { const [a, b] = sessionRange(s); if (ck >= a && ck <= b) { session = s; minutes = Math.round((ck - a) / Math.max(1, b - a) * 120); break; } }
  syncControls(); setMode('live'); resetDiary(); liveExtra = 0; startAttempt();
}

/* painel */
let prevAvail = -1;
function updatePanel(newAttempt) {
  const e = main.env, ck = CK[main.ck];
  $('attempt').textContent = fmtN(attemptNumber(main.ck));
  $('hits').textContent = e.hits; $('kicks').textContent = e.kicks;
  $('acc').textContent = e.kicks ? Math.round(e.hits / e.kicks * 100) + '%' : '–';
  $('tbar').style.width = (e.t / P.maxTime * 100).toFixed(1) + '%';
  const [a, b] = sessionRange(session);
  const frac = Math.min(1, minutes / 120);
  $('stage').innerHTML = mode === 'live'
    ? `Sessão <b>${session + 1}</b> de ${SESSIONS} · app aberto em <b>${fmtMin(minutes)}</b> · média nesta etapa: <b>${ck.hits.toFixed(1)}</b> acertos`
    : `Resumo: foto <b>${main.ck - a + 1}</b> de ${Math.max(1, availIdx() - a + 1)} da sessão · média nesta etapa: <b>${ck.hits.toFixed(1)}</b> acertos`;
  $('lblR').textContent = `Agora · tentativa ${fmtN(attemptNumber(main.ck))}`;
  void frac; void b;
}

/* curva de aprendizado */
function drawChart() {
  const cv = $('chart'), r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2);
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0);
  const w = r.width, h = r.height, padL = 26, padB = 18, padT = 8, padR = 6;
  const maxH = Math.ceil(Math.max(...CK.map(c => c.hits)) / 5) * 5;
  const X = i => padL + (i / (N - 1)) * (w - padL - padR), Y = v => h - padB - (v / maxH) * (h - padT - padB);
  x.font = '500 10px "JetBrains Mono", monospace'; x.fillStyle = '#6b6485'; x.strokeStyle = 'rgba(42,35,64,.1)'; x.lineWidth = 1;
  for (let v = 0; v <= maxH; v += maxH / 3) { x.beginPath(); x.moveTo(padL, Y(v) + .5); x.lineTo(w - padR, Y(v) + .5); x.stroke(); x.textAlign = 'right'; x.fillText(Math.round(v), padL - 4, Y(v) + 3); }
  // limites das sessões
  for (let s = 1; s < SESSIONS; s++) { const e = sessionRange(s)[0]; x.setLineDash([2, 3]); x.beginPath(); x.moveTo(X(e) + .5, padT); x.lineTo(X(e) + .5, h - padB); x.stroke(); x.setLineDash([]); }
  x.textAlign = 'center';
  for (let s = 0; s < SESSIONS; s++) { const [a, b] = sessionRange(s); x.fillStyle = s === session ? '#2a2340' : '#6b6485'; x.fillText(`S${s + 1}`, (X(a) + X(b)) / 2, h - 5); }
  const av = availIdx();
  // parte ainda não liberada
  x.strokeStyle = 'rgba(42,35,64,.25)'; x.setLineDash([3, 3]); x.lineWidth = 1.5; x.beginPath();
  CK.forEach((c, i) => { if (i >= av) { const px = X(i), py = Y(c.hits); i === av ? x.moveTo(px, py) : x.lineTo(px, py); } });
  x.stroke(); x.setLineDash([]);
  // parte liberada
  x.beginPath(); CK.slice(0, av + 1).forEach((c, i) => { const px = X(i), py = Y(c.hits); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.lineTo(X(av), h - padB); x.lineTo(X(0), h - padB); x.closePath(); x.fillStyle = 'rgba(217,72,43,.12)'; x.fill();
  x.beginPath(); CK.slice(0, av + 1).forEach((c, i) => { const px = X(i), py = Y(c.hits); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.strokeStyle = '#d9482b'; x.lineWidth = 2; x.lineJoin = 'round'; x.stroke();
  // marcos
  for (const m of TAPE.milestones) { if (m.ck > av) continue; const c = CK[m.ck]; x.fillStyle = '#2a2340'; x.beginPath(); x.arc(X(m.ck), Y(c.hits), 2.5, 0, TAU); x.fill(); }
  // ponto atual
  const cur = CK[main.ck]; const cx = X(main.ck), cy = Y(cur.hits);
  x.fillStyle = '#fffaf2'; x.beginPath(); x.arc(cx, cy, 5.5, 0, TAU); x.fill(); x.fillStyle = '#d9482b'; x.beginPath(); x.arc(cx, cy, 3.6, 0, TAU); x.fill();
}

/* =========================================================
   Controles
   ========================================================= */
function syncControls() {
  document.querySelectorAll('[data-session]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.session === session)));
  $('clock').value = minutes; $('clockV').textContent = fmtMin(minutes);
}
function setMode(m) {
  mode = m; document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  montageIdx = sessionRange(session)[0];
}
document.querySelectorAll('[data-session]').forEach(b => b.addEventListener('click', () => {
  session = +b.dataset.session; syncControls(); setMode(mode); resetDiary(); liveExtra = 0; startAttempt(); drawChart();
  if (session > 0 && minutes === 0) showBanner(`Sessão ${session + 1}`, 'O atleta continua de onde parou na sessão anterior.', 2200);
}));
$('clock').addEventListener('input', e => {
  minutes = +e.target.value; $('clockV').textContent = fmtMin(minutes);
  const av = availIdx();
  if (av !== prevAvail) { prevAvail = av; syncMarks(true); drawChart(); if (mode === 'live') { liveExtra = 0; startAttempt(); } }
  if (minutes === 120) sessionEnd();
});
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); liveExtra = 0; startAttempt(); }));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
$('tCmp').addEventListener('click', e => {
  compare = !compare; e.currentTarget.setAttribute('aria-pressed', String(compare));
  islands[1].visible = compare; $('cmpLabels').hidden = !compare;
  if (compare) ghost.start(0, attemptSeed);
  resetMain = true;
});
let resetMain = false;
$('bSkin').addEventListener('click', () => { lookIdx = (lookIdx + 1) % LOOKS.length; main.buildAthlete(); ghost.buildAthlete(); $('who').textContent = `Atleta: ${LOOKS[lookIdx].nick} ${LOOKS[lookIdx].num}`; });
let bannerTimer = 0;
function showBanner(big, s, ms) { $('bBig').textContent = big; $('bS').textContent = s; $('banner').classList.add('show'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.remove('show'), ms); }
function sessionEnd() {
  const [a, b] = sessionRange(session), h0 = CK[a].hits, h1 = CK[b].hits;
  const base = 62.4 + session * 1.1, gain = Math.round((0.4 + (h1 - h0) * 0.05) * 10) / 10;
  showBanner('Fim da sessão!', `De ${h0.toFixed(1)} para ${h1.toFixed(1)} acertos por tentativa · Precisão ${base.toFixed(1).replace('.', ',')} → ${(base + gain).toFixed(1).replace('.', ',')}`, 4200);
}

/* =========================================================
   Laço
   ========================================================= */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); drawChart();
}
addEventListener('resize', resize);
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
function cameraFrame() {
  const narrow = innerWidth < innerHeight;
  if (compare) { lookGoal.set(ARENA_GAP / 2, 0, 0); camGoal.set(ARENA_GAP / 2, narrow ? 70 : 40, narrow ? 56 : 44); }
  else { lookGoal.set(0, 0, 1); camGoal.set(0, narrow ? 34 : 20, narrow ? 30 : 25); }
}
let userMoved = false;
controls.addEventListener('start', () => { userMoved = true; });
let last = performance.now(), time = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; time += dt;
  if (resetMain) { resetMain = false; userMoved = false; startAttempt(); }
  main.update(dt, speed, time);
  if (compare) ghost.update(dt, speed, time);
  if (main.env.done && (!compare || ghost.env.done)) {
    attemptEnded();
    if (mode === 'montage') { const av = availIdx(); montageIdx = montageIdx >= av ? sessionRange(session)[0] : Math.min(av, montageIdx + Math.max(1, Math.round((av - sessionRange(session)[0]) / 12))); }
    else liveExtra += 64;
    startAttempt(); drawChart();
  }
  updateParticles(dt);
  cameraFrame();
  if (!userMoved) { camera.position.lerp(camGoal, 1 - Math.pow(.05, dt)); controls.target.lerp(lookGoal, 1 - Math.pow(.05, dt)); }
  controls.update();
  renderer.render(scene, camera);
  hudT += dt; if (hudT > .15) { hudT = 0; updatePanel(false); }
  requestAnimationFrame(frame);
}
camera.position.set(0, 20, 25);
syncControls(); resetDiary(); startAttempt(); resize();
prevAvail = availIdx();
$('loading').remove();
if (!reduceMotion) showBanner('Treino de Precisão', 'Arraste o horário em que o app foi aberto para ver o atleta evoluir.', 3200);
requestAnimationFrame(frame);
</script>
